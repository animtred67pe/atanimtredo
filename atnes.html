var wavadpcm_stepTable = [7, 8, 9, 10, 11, 12, 13, 14, 16, 17, 19, 21, 23, 25, 28, 31, 34, 37, 41, 45, 50, 55, 60, 66, 73, 80, 88, 97, 107, 118, 130, 143, 157, 173, 190, 209, 230, 253, 279, 307, 337, 371, 408, 449, 494, 544, 598, 658, 724, 796, 876, 963, 1060, 1166, 1282, 1411, 1552, 1707, 1878, 2066, 2272, 2499, 2749, 3024, 3327, 3660, 4026, 4428, 4871, 5358, 5894, 6484, 7132, 7845, 8630, 9493, 10442, 11487, 12635, 13899, 15289, 16818, 18500, 20350, 22385, 24623, 27086, 29794, 32767];
var wavadpcm_indexTable = [-1, -1, -1, -1, 2, 4, 6, 8, -1, -1, -1, -1, 2, 4, 6, 8];

function WavAdpcmBlock(samples, _index, blockSize) {
    var out = new Uint8Array(blockSize);
    var index = _index[0];
    var savedNibble = -1;
    var oIdx = 0;
    var sIdx = 0;
    var predicted = samples[sIdx++];
    out[oIdx++] = predicted & 0xFF;
    out[oIdx++] = (predicted & 0xFFFF) >> 8;
    out[oIdx++] = index;
    out[oIdx++] = 0;
    while(oIdx < blockSize) {
        var diff = samples[sIdx++] - predicted;
        var step = wavadpcm_stepTable[index];
        var code = 0, delta = 0;
        if (diff < 0) {
            code = 8;
            diff = -diff;
        }
        if (diff >= step) {
            code |= 4;
            diff -= step;
            delta += step;
        }
        step = step >> 1;
        if (diff >= step) {
            code |= 2;
            diff -= step;
            delta += step;
        }
        step = step >> 1;
        if (diff >= step) {
            code |= 1;
            diff -= step;
            delta += step;
        }
        delta += step >> 1;
        if (savedNibble < 0) {
            savedNibble = code;
        } else {
            out[oIdx++] = (code << 4) | savedNibble;
            savedNibble = -1;
        }
        predicted += (code & 8) ? -delta : delta;
        if (predicted > 32767) predicted = 32767;
        if (predicted < -32768) predicted = -32768;
        index += wavadpcm_indexTable[code];
        if (index > 88) index = 88;
        if (index < 0) index = 0;
    }
    _index[0] = index;
    return out;
}

function WavAdpcmBlockStereo(samplesLeft, sampleRight, _index, blockSize) {
    var out = new Uint8Array(blockSize);
    var chs = [{
        index: _index[0], 
        savedNibble: -1, 
        predicted: 0
    }, {
        index: _index[1], 
        savedNibble: -1, 
        predicted: 0
    }];
    var savedNibble = -1;
    var oIdx = 0;
    var sIdx = 0;
    chs[0].predicted = samplesLeft[sIdx];
    out[oIdx++] = chs[0].predicted & 0xFF;
    out[oIdx++] = (chs[0].predicted & 0xFFFF) >> 8;
    out[oIdx++] = chs[0].index;
    out[oIdx++] = 0;
    chs[1].predicted = sampleRight[sIdx];
    out[oIdx++] = chs[1].predicted & 0xFF;
    out[oIdx++] = (chs[1].predicted & 0xFFFF) >> 8;
    out[oIdx++] = chs[1].index;
    out[oIdx++] = 0;
    sIdx++;
    var __i = 0;
    while(oIdx < blockSize) {
        var channel = (__i >> 3) & 1;
        var offset = (__i >> 4) << 3;
        var _ = __i & 7;
        var diff;
        if (channel == 1) {
            diff = sampleRight[sIdx + offset + _] - chs[channel].predicted;
        } else {
            diff = samplesLeft[sIdx + offset + _] - chs[channel].predicted;
        }
        var step = wavadpcm_stepTable[chs[channel].index];
        var code = 0, delta = 0;
        if (diff < 0) {
            code = 8;
            diff = -diff;
        }
        if (diff >= step) {
            code |= 4;
            diff -= step;
            delta += step;
        }
        step = step >> 1;
        if (diff >= step) {
            code |= 2;
            diff -= step;
            delta += step;
        }
        step = step >> 1;
        if (diff >= step) {
            code |= 1;
            diff -= step;
            delta += step;
        }
        delta += step >> 1;
        if (chs[channel].savedNibble < 0) {
            chs[channel].savedNibble = code;
        } else {
            out[oIdx++] = (code << 4) | chs[channel].savedNibble;
            chs[channel].savedNibble = -1;
        }
        chs[channel].predicted += (code & 8) ? -delta : delta;
        if (chs[channel].predicted > 32767) chs[channel].predicted = 32767;
        if (chs[channel].predicted < -32768) chs[channel].predicted = -32768;
        chs[channel].index += wavadpcm_indexTable[code];
        if (chs[channel].index > 88) chs[channel].index = 88;
        if (chs[channel].index < 0) chs[channel].index = 0;
        __i++;
    }
    _index[0] = chs[0].index;
    _index[1] = chs[1].index;
    return out;
}


function WavAdpcmFormat(dataLen, sampleCount, channels, rate, blockSize) {
    var samplesPerBlock = (2 * (blockSize - 4)) + 1;
    var bytesPerSec = 0;
    var sizeLen = dataLen;
    if (channels == 2) { // TODO
        bytesPerSec = Math.floor(((2 * blockSize) / samplesPerBlock) * rate);
    } else {
        bytesPerSec = Math.floor(((2 * blockSize) / samplesPerBlock) * (rate / 2));
    }
    sizeLen += 52;
    return new Uint8Array([82, 73, 70, 70, sizeLen & 255, sizeLen >> 8, sizeLen >> 16, sizeLen >> 24, 87, 65, 86, 69, 102, 109, 116, 32, 20, 0, 0, 0, 17, 0, channels, 0, rate & 255, rate >> 8, rate >> 16, rate >> 24, bytesPerSec & 255, bytesPerSec >> 8, bytesPerSec >> 16, bytesPerSec >> 24, blockSize & 255, blockSize >> 8, 4, 0, 2, 0, samplesPerBlock & 255, samplesPerBlock >> 8, 102, 97, 99, 116, 4, 0, 0, 0, sampleCount & 255, sampleCount >> 8, sampleCount >> 16, sampleCount >> 24, 100, 97, 116, 97, dataLen & 255, dataLen >> 8, dataLen >> 16, dataLen >> 24]);
}

var ATWavAdpcmEncoder = function(channels, rate) {
    this.blockSize = 512;
    this.channels = channels;
    this.rate = rate;
    this.result = [new Uint8Array(0)];
    this.samplesPerBlock = (2 * (this.blockSize - 4)) + 1;
    this.samplesBlockLeft = new Int16Array(this.samplesPerBlock);
    this.samplesBlockRight = new Int16Array(this.samplesPerBlock);
    this.sid = 0;
    this.lastIndex = new Uint8Array(2);
    this.totalBytes = 0;
    this.totalSamples = 0;
}
ATWavAdpcmEncoder.prototype.getSampleRate = function() {
    return this.rate;
}
ATWavAdpcmEncoder.prototype.putSamples = function(samplesLeft, samplesRight) {
    for (var j = 0; j < samplesLeft.length; j++) {
        var sampleLeft = samplesLeft[j];
        var sampleRight = samplesRight[j];
        if (this.sid == this.samplesPerBlock) {
            this.flushSample();
            for (var i = 0; i < this.samplesPerBlock; i++) {
                this.samplesBlockLeft[i] = 0;
                this.samplesBlockRight[i] = 0;
            }
            this.sid = 0;
        }
        if (this.channels == 2) {
            if (sampleLeft > 1) sampleLeft = 1;
            if (sampleLeft < -1) sampleLeft = -1;
            if (sampleRight > 1) sampleRight = 1;
            if (sampleRight < -1) sampleRight = -1;
            this.samplesBlockLeft[this.sid] = (sampleLeft < 0 ? 0x8000 : 0x7fff) * sampleLeft;
            this.samplesBlockRight[this.sid] = (sampleRight < 0 ? 0x8000 : 0x7fff) * sampleRight;
        } else {
            var r = (sampleLeft + sampleRight) / 2;
            if (r > 1) r = 1;
            if (r < -1) r = -1;
            this.samplesBlockLeft[this.sid] = (r < 0 ? 0x8000 : 0x7fff) * r;
        }
        this.sid++;
    }
    
};
ATWavAdpcmEncoder.prototype.flushSample = function() {
    var b = (this.channels == 2) ? WavAdpcmBlockStereo(this.samplesBlockLeft, this.samplesBlockRight, this.lastIndex, this.blockSize * 2) : WavAdpcmBlock(this.samplesBlockLeft, this.lastIndex, this.blockSize);
    this.result.push(b);
    this.totalBytes += b.length;
    this.totalSamples += this.samplesPerBlock;
};
ATWavAdpcmEncoder.prototype.flush = function() {
    this.flushSample();
    this.result[0] = WavAdpcmFormat(this.totalBytes, this.totalSamples, this.channels, this.rate, this.blockSize);
};
ATWavAdpcmEncoder.prototype.getBytes = function() {
    return this.result;
};

var AtAudioBuf = function(audioContext) {
    this.audioContext = audioContext;
    this.inputBufferL = new Float64Array(0x2000);
    this.inputBufferR = new Float64Array(0x2000);
    this.inputBufferPos = 4096;
    this.inputReadPos = 0;
    this.sampleRate = 44100;
    this.fraction = 0;
    this.thisSampleLeft = 0;
    this.thisSampleRight = 0;
    this.nextSampleLeft = 0;
    this.nextSampleRight = 0;
    this.source = this.audioContext.createScriptProcessor(2048, 2, 2);
    this.source.onaudioprocess = this.writeSampleData.bind(this);
    this.source.connect(audioContext.destination);
    this._frames = 0;
}
AtAudioBuf.prototype.writeSampleData = function(evt) {
    var output1 = evt.outputBuffer.getChannelData(0);
    var output2 = evt.outputBuffer.getChannelData(1);
    if (this._frames == 0) {
        if ((this.inputReadPos + 2048) > this.inputBufferPos) {
            this.inputReadPos = this.inputBufferPos - 4096;
        }
        var jghj = (this.inputReadPos + 4096) - this.inputBufferPos;
        var b = this.inputBufferPos - 1;
        for (var i = 0; i < 2048; i++) {
            var a = this.inputReadPos;
            if (a > b) a = b;
            output1[i] = this.inputBufferL[a & 0x1fff];
            output2[i] = this.inputBufferR[a & 0x1fff];
            this.inputReadPos++;
        }
        if (jghj < 0) {
            this.inputReadPos -= jghj;
        }
        this._frames++;
    } else {
        for (var i = 0; i < 2048; i++) {
            output1[i] = 0;
            output2[i] = 0;
        }
        this.inputReadPos = this.inputBufferPos - 4096;
    }
}
AtAudioBuf.prototype.nextBuffer = function(left, right, samplesPerFrame) {
    var stepSize = this.sampleRate / this.audioContext.sampleRate;
    var oadd = 0;
    while (oadd < samplesPerFrame) {
        this.fraction += stepSize;
        while (this.fraction >= 1) {
            this.thisSampleLeft = this.nextSampleLeft;
            this.thisSampleRight = this.nextSampleRight;
            this.nextSampleLeft = left[oadd];
            this.nextSampleRight = right[oadd];
            oadd++;
            this.fraction -= 1;
        }
        var valL = (this.fraction == 0) ? this.thisSampleLeft : this.thisSampleLeft + (this.fraction * (this.nextSampleLeft - this.thisSampleLeft));
        var valR = (this.fraction == 0) ? this.thisSampleRight : this.thisSampleRight + (this.fraction * (this.nextSampleRight - this.thisSampleRight));
        this.inputBufferL[this.inputBufferPos & 0x1fff] = valL;
        this.inputBufferR[this.inputBufferPos & 0x1fff] = valR;
        this.inputBufferPos++;    
    }
    this._frames = 0;
}
AtAudioBuf.prototype.isRunning = function() {
    return this.audioContext.state == "running";
}
AtAudioBuf.prototype.start = function() {
    var _source = audioContext.createBufferSource();
    _source.connect(this.source);
    _source.start();
}

var mod = function(x, y) {

            var inputBufferPos = 0;

            var channelWav = [new Float32Array(1024), new Float32Array(1024), new Float32Array(1024), new Float32Array(1024), new Float32Array(1024)];

            function smindex() {
                for (var i = 0; i < samplesPerFrame; i++) {
                    var gd = inputBufferPos % 1024;
                    var sampleLeft = 0;
                    var sampleRight = 0;
                    channelWav[0][gd] = 0;
                    channelWav[1][gd] = 0;
                    channelWav[2][gd] = 0;
                    channelWav[3][gd] = 0;
                    channelWav[4][gd] = 0;
                    for (var ch = 0; ch < 5; ch++) {
                        var ch_left = gbchannels[ch].volume;
                        var SquareWave = gbchannels[ch].samples;
                        if ((ch_left) > 0) {
                            var speedf = gbchannels[ch].speed;
                            var rg = (gd - 512) * speedf;
                            rg = (rg - (SquareWave.length / 2)) % SquareWave.length;
                            if (rg < 0) rg += SquareWave.length;
                            var res2 = SquareWave[rg | 0] || 0;
                            channelWav[ch][gd] += res2 * ch_left;
                        }
                    }
                    for (var ch = 0; ch < 5; ch++) {
                        var ch_left = gbchannels[ch].volume;
                        var SquareWave = gbchannels[ch].samples;
                        var iwav = gbchannels[ch].sampleIndex;
                        var speedf = gbchannels[ch].speed;
                        iwav += speedf;
                        iwav = iwav % SquareWave.length;
                        var res = SquareWave[(iwav % SquareWave.length) | 0] || 0;
                        sampleLeft += res * ch_left;
                        sampleRight += res * ch_left;
                        gbchannels[ch].sampleIndex = iwav || 0;
                    }
                    outputLeft[i] = sampleLeft;
                    outputRight[i] = sampleRight;
                    inputBufferPos++;
                }
                ataudioh.nextBuffer(outputLeft, outputRight, samplesPerFrame);
            }

            function stepAudio() {
                if (ataudioh.isRunning()) {
                    if (!playedSound) {
                        ataudioh.start();
                        playedSound = true;
                    }
                } else {
                    audioContext.resume();
                }
                for (var ch = 0; ch < 4; ch++) {
                    var volume = nes.APU_Volumes[ch] * nes.APU_Length_Counter_Unsilenced[ch];
                    var freq = 0;
                    var fgd = ch < 2 ? nes.Calculate_sweep_unit_target_period_for_channel(ch) : 0;
                    if ((ch < 2 && (nes.APU_Periods[ch] < 8 || fgd > 2047)) || (ch == 2 && nes.APU_Periods[ch] < 2)) {
                        volume = 0;
                    } else {
                        if (ch == 3) {
                            if (nes.APU_Noise_Mode == 1) {
                                gbchannels[ch].samples = WaveNoise2;
                            } else {
                                gbchannels[ch].samples = WaveNoise1;
                            }
                            freq = nes.CPU_Clock_Rate_Hz / (84 * nes.APU_Periods[ch]);
                        } else {
                            if (ch != 2) {

                                freq = nes.CPU_Clock_Rate_Hz / (32 * nes.APU_Periods[ch]) * 0.32;
                            }
                        }

                    gbchannels[ch].volume = volume / 4;
                    gbchannels[ch].speed = freq / 440;

            var imageData = ctx2.createImageData(256, 240);

            var needsRender = false;
            
            function drawFrame() {
                var Framebuffer = nes.Framebuffer;
                var imgData = imageData.data;
                var idx = 0;
                for (var i = 0; i < (256*240); i++) {
                    var r1 = Framebuffer[i + nes.last_generated_framebuffer];
                    var rsgf = idx % ((256*240)*4);
                    if (r1 > 0) {
                        var gddf = PPU_Colors[(r1 - 1) | 0];
                        if (gddf != null) {
                            var r = gddf & 255;
                            var g = (gddf >> 8) & 255;
                            var b = (gddf >> 16) & 255;
                            imgData[rsgf] = b;
                            imgData[rsgf + 1] = g;
                            imgData[rsgf + 2] = r;
                            imgData[rsgf + 3] = 255;    
                        }
                    }
                    idx += 4;
                }
                // Update framebuffer variables to reflect that the screen has been redrawn.
                // If "Draw Frame" runs multiple times before the PPU generates another frame, then the next active framebuffer must not be updated on subsequent times.
                // In the event that it was, one framebuffer would become unused, leaving only two in use, which breaks assumptions the rendering system depends on.
                nes.next_active_framebuffer = 0;
                nes.last_drawn_framebuffer = nes.last_generated_framebuffer;
                nes.frame_updated = 0;
            }

            function Draw(is_sb) {
                var imgData1 = imageData.data;
                var imgData2 = imageData2.data;
                var imgDataOut = imageDataOutput.data;
                if (is_sb) {
                    for (var i = 0; i < 240; i += 2) {
                        var y = (i * 256) * 4;
                        for (var j = 0; j < 256; j++) {
                            imgDataOut[y] = imgData1[y];
                            y++;
                            imgDataOut[y] = imgData1[y];
                            y++;
                            imgDataOut[y] = imgData1[y];
                            y++;
                            imgDataOut[y] = imgData1[y];
                            y++;
                        }
                        for (var j = 0; j < 256; j++) {
                            imgDataOut[y] = imgData2[y];
                            y++;
                            imgDataOut[y] = imgData2[y];
                            y++;
                            imgDataOut[y] = imgData2[y];
                            y++;
                            imgDataOut[y] = imgData2[y];
                            y++;
                        }
                    }  
                } else {
                    for (var i = 0; i < imgDataOut.length; i++) {
                        imgDataOut[i] = imgData1[i];
                    }
                }
                ctx2.putImageData(imageDataOutput, 0, 0);
            }

            function rframe() {
                var imgData = imageData.data;
                var imgData2 = imageData2.data;
                if (needsRender) {
                    for (var i = 0; i < imgData.length; i++) 
                    imgData2[i] = imgData[i];
                    needsRender = false;
                }
                if (playedSound) nes.runFrame();
                stepAudio();
                smindex();
                if (nes.frame_updated == 1) {
                    drawFrame();
                    needsRender = true;
                }
                if (needsRender) {
                    Draw();
                }
                if (gbaudioencoder) {
                    gbaudioencoder.putSamples(outputLeft, outputRight);
                }
            }

                    if (dt < 0) dt = 0;
                    if (dt > 16) dt = 16;
                    startTime = _time;
                    fdggfd += dt;
                    startTimeSub += dt;
                    while (startTimeSub > 0) {
                        rframe();
                        startTimeSub -= 8;
                    }
                    if (wavescene.style.display != "none") {
                        drawWaveChannel();
                    }
                }
            }, 8);
