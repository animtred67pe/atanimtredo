                gbc.initSystem();
                menu_gb.style.display = "none";
                if (gbc.ERAM.length) {
                    e_eram_e.style.display = "";
                } else {
                    e_eram_e.style.display = "none";
                }
            }

            function gdfgdg_reset() {
                gbreset();
                gbseteram();
                gbSetPaused(false);
            }

            function gbLoadRom(rom) {
                GB_STATE = null;
                ddgbc.style.display = "none";
                GB_ROM_DATA = rom;
                gbreset();
                gbseteram();
                gbSetPaused(false);
            }

            function downloadgbc() {
                if (GB_ROM_DATA) {
                    var b = new Blob([GB_ROM_DATA]);
                    var a = document.createElement("a");
                    a.href = URL.createObjectURL(b);
                    a.download = gb_filename ? gb_filename : gbc.getROMName() + "." + (gbc.CGB ? "gbc" : "gb");
                    a.click();
                }
            }

            function gbloadurl() {
                loadgburl(txtgbrom.value);
            }

            ddgbc.onclick = function() {
                downloadgbc();
            }

            function urlToNameFile(url) {
                try {
                    var j = url;
                    var h = j.indexOf("?");
                    var s = j.length;
                    if (h >= 0) 
                        s = h;
                    var o = s;
                    while((s >= 0) && (j.charAt(s) != "/")) 
                        s--;
                    return decodeURIComponent(j.slice(s + 1, o));
                } catch(e) {
                    return null;
                }
            };

            function loadgburl(url) {
                var xhr = new XMLHttpRequest();
                xhr.onload = function() {
                    if (xhr.status == 200) {
                        gb_filename = urlToNameFile(url);
                        gbctitle.textContent = "GBC.js By EAXDMLPSXF";
                        gbLoadRom(new Uint8Array(xhr.response));
                        ddgbc.style.display = "";
                    }
                }
                xhr.responseType = "arraybuffer";
                xhr.open("GET", url);
                xhr.send();
            }

            
            function __resize_() {
                var iw = window.innerWidth;
                var ih = window.innerHeight - minHH;
                var w = 160;
                var h = 144;
                var sca = 1;
                var fa = false;
                if ((ih / h) > (iw / w)) {
                    sca = iw / w;
                    fa = true;
                } else {
                    sca = ih / h;
                    fa = false;
                }
                var ww = w * sca;
                var hh = h * sca;
                if (scaleMode == 2) {
                    ww = iw;
                    hh = ih;
                }
                gbscene.style.width = ww + "px";
                gbscene.style.height = hh + "px";
                wavescene.width = iw;
                wavescene.height = ih;
                wavescene.style.top = minHH + "px";
                wavescene.style.left = "0px";
                if (fa) {
                    playerArea.style.left = 0 + "px";
                    playerArea.style.top = ((((ih - hh)) / 2) + minHH) + "px";
                } else {
                    playerArea.style.left = (((iw - ww)) / 2) + "px";
                    playerArea.style.top = minHH + "px";
                }
            }

            window.onresize = function() {
                __resize_();
            }

            __resize_();

            function opendemo() {
                if (!sle) {
                    gdfdfgdfgdg.style.display = "none";
                    minHH = 0;
                    if (document.body.requestFullScreenWithKeys) {
                        document.body.requestFullScreenWithKeys();
                    } else if (document.body.webkitRequestFullScreen) {
                        document.body.webkitRequestFullScreen(Element.ALLOW_KEYBOARD_INPUT);
                    } else if (document.body.requestFullscreen) {
                        document.body.requestFullscreen();
                    }
                    __resize_();
                    sle = true;
                }
            }
            function closedemo() {
                if (sle) {
                    gdfdfgdfgdg.style.display = "";
                    minHH = 18;
                    if (document.fullscreenElement === document.body || document.webkitFullscreenElement === document.body) {
                        if (document.exitFullscreen) {
                            document.exitFullscreen();
                        } else if (document.mozCancelFullScreen) {
                            document.mozCancelFullScreen();
                        } else if (document.webkitCancelFullScreen) {
                            document.webkitCancelFullScreen();
                        } else if (document.webkitExitFullscreen) {
                            document.webkitExitFullscreen();
                        }
                    }
                    __resize_();
                    sle = false;
                }
            }

            document.addEventListener('fullscreenchange', function() {_fullscreenchange()});
            document.addEventListener('mozfullscreenchange', function() {_fullscreenchange()});
            document.addEventListener('webkitfullscreenchange', function() {_fullscreenchange()});

            function gbfullscreenbtn() {
                if (sle) {
                    closedemo();
                } else {
                    opendemo();
                }
            }

            function gbjoykb(control, iskeydown) {
                if (control == "down") {
                    gbc.Input[0] = iskeydown ? 0 : 1;
                }
                if (control == "up") {
                    gbc.Input[1] = iskeydown ? 0 : 1;
                }
                if (control == "left") {
                    gbc.Input[2] = iskeydown ? 0 : 1;
                }
                if (control == "right") {
                    gbc.Input[3] = iskeydown ? 0 : 1;
                }
                if (control == "start") {
                    gbc.Input[4] = iskeydown ? 0 : 1;
                }
                if (control == "select") {
                    gbc.Input[5] = iskeydown ? 0 : 1;
                }
                if (control == "B") {
                    gbc.Input[6] = iskeydown ? 0 : 1;
                }
                if (control == "A") {
                    gbc.Input[7] = iskeydown ? 0 : 1;
                }
            }
            var atmkb = null;
            if (AT_MobileKB.isMobileOrTablet()) {
                atmkb = new AT_MobileKB(0, gdfdfgdfgdg_atmkb);
                atmkb.callback = function(control, mousedown) {
                    if (control == "gbc.js") {
                        if (mousedown) {
                            gbmenubtn();
                        }
                    } else {
                        gbjoykb(control, mousedown);
                    }
                }    
            }

            window.addEventListener("keydown", function(e) {
                if (e.keyCode == 70) {
                    gbfullscreenbtn();
                }
                if (e.keyCode == 78) {
                    if (wavescene.style.display == "none") {
                        wavescene.style.display = "";
                    } else {
                        wavescene.style.display = "none";
                    }
                }
                if (e.keyCode == 84) {
                    gbc.turbo = true;
                }
                if (e.keyCode == 57) {
                    gbc.ROM = [];
                }
                if (e.keyCode == 56) {
                    gdfgdg_emptyflag();
                }
                if (e.keyCode == 55) {
                    gbc.ERAM = new Uint8Array(0);
                }
                if (e.keyCode == 81) {
                    GB_STATE = gbc.saveState();
                }
                if (e.keyCode == 87) {
                    if (GB_STATE) {
                        gbc.Flags = [];
                        gbc.loadState(GB_STATE);
                    }
                }
                if (e.keyCode == 80) {
                    gdfgdg_playpause();
                }
                if (menu_gb.style.display == "none") {
                    if (e.keyCode == 48) {
                        gdfgdg_reset();
                    }
                    if (e.keyCode == 40) {
                        gbc.Input[0] = 0;
                    }
                    if (e.keyCode == 38) {
                        gbc.Input[1] = 0;
                    }
                    if (e.keyCode == 37) {
                        gbc.Input[2] = 0;
                    }
                    if (e.keyCode == 39) {
                        gbc.Input[3] = 0;
                    }
                    if (e.keyCode == 32) {
                        gbc.Input[4] = 0;
                    }
                    if (e.keyCode == 67) {
                        gbc.Input[5] = 0;
                    }
                    if (e.keyCode == 88) {
                        gbc.Input[6] = 0;
                    }
                    if (e.keyCode == 90) {
                        gbc.Input[7] = 0;
                    }
                }
            });
            window.addEventListener("keyup", function(e) {
                if (e.keyCode == 84) {
                    gbc.turbo = false;
                }
                if (e.keyCode == 40) {
                    gbc.Input[0] = 1;
                }
                if (e.keyCode == 38) {
                    gbc.Input[1] = 1;
                }
                if (e.keyCode == 37) {
                    gbc.Input[2] = 1;
                }
                if (e.keyCode == 39) {
                    gbc.Input[3] = 1;
                }
                if (e.keyCode == 32) {
                    gbc.Input[4] = 1;
                }
                if (e.keyCode == 67) {
                    gbc.Input[5] = 1;
                }
                if (e.keyCode == 88) {
                    gbc.Input[6] = 1;
                }
                if (e.keyCode == 90) {
                    gbc.Input[7] = 1;
                }
            });

            var playedSound = false;

            function gfhfhfh(H, type) {
                var S = [];
                if (type == 4) {
                    for (var i = 0; i < H; i++) {
                        S.push((i > (H / 4)) ? -0.5 : 0.5);
                    }
                } else if (type == 3) {
                    for (var i = 0; i < H; i++) {
                        S.push((i > (H / 4)) ? 0.5 : -0.5);
                    }
                } else {
                    if (type == 2) {
                       for (var i = 0; i < H; i++) {
                            S.push((i > (H / 8)) ? 0.5 : -0.5);
                        }
                    } else {
                        if (type == 1) {
                            for (var i = 0; i < H; i++) {
                                S.push((i > (H / 2)) ? 0.5 : -0.5);
                            }
                        } else {
                            for (var i = 0; i < H; i++) {
                                S.push((i - (H / 2)) / (H / 2));
                            }
                        }
                    }
                }
                return S;
            }

            var Channel = function(samples) {
                this.speed = 0;
                this.samples = samples;
                this.sampleIndex = 0;
                this.leftVolume = 0;
                this.rightVolume = 0;
            }

            var gbchannels = [new Channel([0]), new Channel([0]), new Channel(gfhfhfh(32, 0)), new Channel([0])];

            var channelDutyCycle = [0, 0];

            var wavDutyCycle = [gfhfhfh(100, 2), gfhfhfh(100, 3), gfhfhfh(100, 1), gfhfhfh(100, 4)];

            var sawto = gfhfhfh(100, 0);

            var WaveNoise1 = [];
            var WaveNoise2 = [];

            var randomFactor = 1;
            var LSFR = 0x7FFF;
            var LSFRShifted = 0x3FFF;
            for (var index = 0; index < 0x8000; ++index) {
                randomFactor = 1 - (LSFR & 1);
                WaveNoise1.push(randomFactor - 0.5);
                LSFRShifted = LSFR >> 1;
                LSFR = LSFRShifted | (((LSFRShifted ^ LSFR) & 0x1) << 14);
            }
            LSFR = 0x7F;
            for (index = 0; index < 0x80; ++index) {
                randomFactor = 1 - (LSFR & 1);
                WaveNoise2.push(randomFactor - 0.5);
                LSFRShifted = LSFR >> 1;
                LSFR = LSFRShifted | (((LSFRShifted ^ LSFR) & 0x1) << 6);
            }

            gbchannels[0].samples = wavDutyCycle[0];
            gbchannels[1].samples = wavDutyCycle[0];

            var audioRunning = true;
            var channelWav = [new Float32Array(1024), new Float32Array(1024), new Float32Array(1024), new Float32Array(1024)];

            var AUDIO_BUFFERING = 512;
            var SAMPLE_COUNT = 4 * 1024;
            var SAMPLE_MASK = SAMPLE_COUNT - 1;

            var outputLeft = new Float32Array(SAMPLE_COUNT);
            var outputRight = new Float32Array(SAMPLE_COUNT);

            var fgdgfdg = 0;
            var sampleIndex = 2048;

            function smindex() {
                var ospeed = 44100 / audioContext.sampleRate;
                for (var i = 0; i < 512; i++) {
                    var sampleLeft = 0;
                    var sampleRight = 0;
                    if (audioRunning) {
                        var gd = sampleIndex % 1024;
                        channelWav[0][gd] = 0;
                        channelWav[1][gd] = 0;
                        channelWav[2][gd] = 0;
                        channelWav[3][gd] = 0;
                        for (var ch = 0; ch < 4; ch++) {
                            var ch_left = gbchannels[ch].leftVolume;
                            var ch_right = gbchannels[ch].rightVolume;
                            var SquareWave = gbchannels[ch].samples;
                            var iwav = gbchannels[ch].sampleIndex;
                            if ((ch_left + ch_right) > 0) {
                                iwav += ospeed * gbchannels[ch].speed;
                                iwav = iwav % SquareWave.length;
                                var res = SquareWave[(iwav % SquareWave.length) | 0] || 0;
                                var rg = (gd - 512) * (ospeed * gbchannels[ch].speed);
                                rg = (rg - (SquareWave.length / 2)) % SquareWave.length;
                                if (rg < 0) rg += SquareWave.length;
                                var res2 = SquareWave[rg | 0] || 0;
                                channelWav[ch][gd] += (res2 * ch_left) + (res2 * ch_right) / 2;
                                sampleLeft += res * ch_left;
                                sampleRight += res * ch_right;
                            } else {
                                iwav = 0;
                            }
                            gbchannels[ch].sampleIndex = iwav;
                        }   
                    }
                    outputLeft[sampleIndex % SAMPLE_COUNT] = sampleLeft;
                    outputRight[sampleIndex % SAMPLE_COUNT] = sampleRight;
                    sampleIndex++;
                }
            }

            function writeSampleData(evt) {
                smindex();
                var output1 = evt.outputBuffer.getChannelData(0);
                var output2 = evt.outputBuffer.getChannelData(1);
                for (var i = 0; i < AUDIO_BUFFERING; i++) {
                    if (audioRunning) {
                        output1[i] = outputLeft[fgdgfdg % SAMPLE_COUNT];
                        output2[i] = outputRight[fgdgfdg % SAMPLE_COUNT];
                    } else {
                        output1[i] = 0;
                        output2[i] = 0;
                    }
                    fgdgfdg++;
                }
            }

            var audioContext = new AudioContext();

            var source = audioContext.createScriptProcessor(AUDIO_BUFFERING, 2, 2);
            source.onaudioprocess = writeSampleData;
            source.connect(audioContext.destination);

            function loadGBFile(f) {
                gb_filename = f.name || "";
                gbctitle.textContent = gb_filename;
                var reader = new FileReader();
                reader.onload = function (e) {
                    var data = new Uint8Array(e.target.result);
                    gbLoadRom(data);
                };
                reader.readAsArrayBuffer(f);
            }

            function gbopenrom() {
                var sa = document.createElement('input');
                sa.type = 'file';
                sa.accept = '.gb, .gbc';
                sa.addEventListener('change', function (e) {
                    var file = e.target.files[0];
                    if (!file) {
                        return;
                    }
                    loadGBFile(file);
                }, false);
                sa.click();
            }

            function dropHandler(ev) {
                ev.preventDefault();
                if (ev.dataTransfer.items) {
                    var item = ev.dataTransfer.items[0];
                    if (item) {
                        if (item.kind === 'file') {
                            var file = item.getAsFile();
                            loadGBFile(file);
                        }
                    };
                }
            }
            function dragOverHandler(ev) {
                ev.preventDefault();
            }
            window.addEventListener("drop", dropHandler);
            window.addEventListener("dragover", dragOverHandler);

            function playSound() {
                if (audioContext.state == "running") {
                    if (!playedSound) {
                        var _source = audioContext.createBufferSource();
                        _source.connect(source);
                        _source.start();
                        playedSound = true;    
                    }
                } else {
                    audioContext.resume();
                }
            }

            function gbSetPaused(p) {
                gbPaused = p;
                if (gbPaused) {
                    menu_gb.style.display = "";
                    playerArea.style.opacity = 0.33;
                } else {
                    menu_gb.style.display = "none";
                    playerArea.style.opacity = 1;
                }
            }
            
            function gdfgdg_playpause() {
                gbSetPaused(!gbPaused);
            }

            function drawWaveChannel() {
                var glen = wavescene.height / 4;
                ctx.clearRect(0, 0, wavescene.width, wavescene.height);
                ctx.beginPath();
                for (var ch = 0; ch < 4; ch++) {
                    ctx.moveTo(0, (glen / 2) + (ch * glen));
                    for (var i = 0; i < 256; i++) {
                        var wavsample = channelWav[ch][((i / 256) * 1024) | 0] || 0;
                        ctx.lineTo((i / 256) * wavescene.width, ((wavsample * (glen / 2)) + (glen / 2)) + (ch * glen));
                    }
                }
                ctx.strokeStyle = "#fff";
                ctx.stroke();
            }

            function stepAudio() {
                var DCPU16 = gbc.DCPU16;
                if (!DCPU16) {
                    var c2data = gbchannels[2].samples;
                    for (var i = 0; i < 32; i++) {
                        c2data[i] = (gbc.WaveTable[i] - 8) / 16;
                    }
                    if ((gbc.NoiseChannelWidthMode & 1) == 1) {
                        gbchannels[3].samples = WaveNoise2;
                    } else {
                        gbchannels[3].samples = WaveNoise1;
                    }    
                }
                for (var ch = 0; ch < 4; ch++) {
                    var volume = (gbc.AudioEngine[(ch * 9) + 6] / 100) * gbc.AudioEngineEnables[ch];
                    if (volume > 1) volume = 1;
                    volume /= 4;
                    if (DCPU16) {
                        gbchannels[ch].samples = sawto;
                    } else {
                        if (ch < 2) {
                            var cDutyCycle = gbc.AudioEngineDutyCycle[ch] & 3;
                            if (channelDutyCycle[ch] != cDutyCycle) {
                                gbchannels[ch].samples = wavDutyCycle[cDutyCycle];
                                channelDutyCycle[ch] = cDutyCycle;
                            }
                        }    
                    }
                    var freq = gbc.AudioEngine[(ch * 9) + 7];
                    if (freq > 0) {
                        if (ch == 3) {
                            gbchannels[ch].speed = freq / 5440;
                            if (DCPU16) {
                                volume = 0;
                            }
                        } else {
                            if (ch == 2) {
                                if (DCPU16) {
                                    gbchannels[ch].speed = (freq * Math.floor(gbc.WaveChannelMult)) / 440;
                                    volume /= 2;
                                } else {
                                    gbchannels[ch].speed = (freq * 0.32) / 880;
                                }
                            } else {
                                gbchannels[ch].speed = freq / 440;
                            }
                        }    
                    }
                    if (DCPU16) {
                        gbchannels[ch].leftVolume = gbc.MasterVolume * volume;
                        gbchannels[ch].rightVolume = gbc.MasterVolume * volume;
                    } else {
                        gbchannels[ch].leftVolume = gbc.AudioEngineStereoLeft[ch] * volume;
                        gbchannels[ch].rightVolume = gbc.AudioEngineStereoRight[ch] * volume;
                    }
                }
                if (wavescene.style.display != "none") {
                    drawWaveChannel();
                }
            }

            setInterval(function() { 
                if (!gbPaused && (!document.hidden && !document.msHidden && !document.mozHidden && !document.webkitHidden)) {
                    audioRunning = true;
                    playSound();
                    gbc.frame();
                    stepAudio();
                } else {
                    audioRunning = false;
                }
            }, 8);
        </script>
